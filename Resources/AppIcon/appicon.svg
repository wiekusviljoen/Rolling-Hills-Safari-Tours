<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="26" fill="#FFFFFF"/>

  <!-- Wave group (teal tones) -->
  <g transform="translate(4,4)">
    <!-- Large upper wave (filled) -->
    <path d="M16 24 C36 4, 76 4, 96 24 C80 16, 56 44, 30 48 C18 50, 12 45, 16 24 Z"
          fill="#2E8F8C" stroke="#17605C" stroke-width="2"/>

    <!-- Middle wave (accent) -->
    <path d="M8 54 C36 34, 76 34, 104 54 C80 46, 56 74, 28 78 C14 80, 10 74, 8 54 Z"
          fill="#1E6F6A" opacity="0.95"/>

    <!-- Lower thin wave (foreground stroke) -->
    <path d="M6 74 C34 56, 68 56, 96 74"
          fill="none" stroke="#17605C" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
